name: Enable Pages from gh-pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages (legacy, gh-pages branch)
        run: |
          echo "=== create pages legacy (gh-pages /) ==="
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          echo ""
          echo "=== get pages ==="
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages
          echo ""
