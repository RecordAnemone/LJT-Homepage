name: Debug Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  administration: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Try enabling Pages variants
        run: |
          echo "=== create pages legacy (master /) ==="
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages -d '{"build_type":"legacy","source":{"branch":"master","path":"/"}}'
          echo ""
          echo "=== create pages workflow ==="
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages -d '{"build_type":"workflow","source":{"branch":"master","path":"/"}}'
          echo ""
          echo "=== get pages again ==="
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages
          echo ""
