name: Debug Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect token and repo settings
        run: |
          echo "=== actions workflow permissions ==="
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/actions/permissions/workflow
          echo ""
          echo "=== get pages ==="
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages
          echo ""
          echo "=== create pages (workflow build) ==="
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages -d '{"build_type":"workflow","source":{"branch":"master","path":"/"}}'
          echo ""
